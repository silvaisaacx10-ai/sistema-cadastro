<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Validação | Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Novo Cadastro</h2>
            <p>Preencha os dados para validação no sistema</p>
        </header>
        
        <div class="card">
            <div class="form-row">
                <div class="form-group full-width">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Ex: João da Silva">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="11">
                </div>
                <div class="form-group">
                    <label for="dataNasc">Nascimento</label>
                    <input type="text" id="dataNasc" placeholder="DD/MM/AAAA" maxlength="10">
                </div>
            </div>
            
            <button class="btn-primary" onclick="validarCPF()">Validar Documento</button>
            <p id="status-cpf" class="status-msg"></p>
        </div>

        <div class="divisor"></div>

        <div class="card">
            <div class="form-row">
                <div class="form-group full-width cep-group">
                    <label for="cep">CEP</label>
                    <div class="input-with-button">
                        <input type="text" id="cep" placeholder="00000000" maxlength="8">
                        <button class="btn-secondary" onclick="buscarCEP()">Buscar</button>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label for="rua">Endereço</label>
                    <input type="text" id="rua" readonly placeholder="Rua, Avenida, etc...">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" readonly>
                </div>
                <div class="form-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" readonly>
                </div>
                <div class="form-group small">
                    <label for="estado">UF</label>
                    <input type="text" id="estado" readonly>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
